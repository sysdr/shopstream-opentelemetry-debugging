<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 2 — The 5-minute investigation</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><rect x="30" y="220" width="170" height="70" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="115.0" y="251.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Alert or complaint:</text><text x="115.0" y="269.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">checkout p99 up</text><rect x="215" y="220" width="170" height="70" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="300.0" y="251.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Query recent traces</text><text x="300.0" y="269.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">service=checkout</text><rect x="400" y="220" width="170" height="70" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="485.0" y="251.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Self time per</text><text x="485.0" y="269.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">service, p99</text><rect x="585" y="220" width="170" height="70" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="670.0" y="251.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Largest self time</text><text x="670.0" y="269.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">= the culprit</text><rect x="770" y="220" width="170" height="70" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="855.0" y="251.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Open one slow trace</text><text x="855.0" y="269.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">confirm the span</text><path d="M200.0,255.0 L215.0,255.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M385.0,255.0 L400.0,255.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M570.0,255.0 L585.0,255.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M755.0,255.0 L770.0,255.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><text x="30" y="360" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">Total latency points everywhere (every caller gets slower). Self time points at one service.</text></svg>
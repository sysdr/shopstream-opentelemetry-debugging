<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 3 — RED dashboards and alerts</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><text x="32" y="82" font-size="14" fill="#71717a">Prometheus scrapes /metrics every 5 s; Grafana shows Rate, Errors, Duration; two alert rules compete</text><rect x="40" y="110" width="170" height="70" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="125.0" y="141.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">checkout</text><text x="125.0" y="159.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">/metrics</text><rect x="40" y="210" width="170" height="70" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="125.0" y="241.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">inventory</text><text x="125.0" y="259.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">/metrics</text><rect x="40" y="310" width="170" height="70" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="125.0" y="341.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">payments</text><text x="125.0" y="359.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">/metrics</text><rect x="320" y="190" width="200" height="104" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="420.0" y="229.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Prometheus</text><text x="420.0" y="247.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">scrape 5 s</text><text x="420.0" y="265.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">rules 5 s</text><path d="M630,120 v64 a135.0,10 0 0 0 270,0 v-64" fill="#fafafa" stroke="#18181b" stroke-width="1.5"/><ellipse cx="765.0" cy="120" rx="135.0" ry="10" fill="#fafafa" stroke="#18181b" stroke-width="1.5"/><text x="765.0" y="154.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Grafana</text><text x="765.0" y="172.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">RED dashboard</text><rect x="630" y="260" width="270" height="100" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="765.0" y="297.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Alerts</text><text x="765.0" y="315.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">AnyCheckoutError (noisy)</text><text x="765.0" y="333.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">CheckoutErrorRateHigh (5% for 30 s)</text><path d="M320.0,209.1 L210.0,172.9" fill="none" stroke="#18181b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ak)"/><path d="M320.0,243.0 L210.0,244.1" fill="none" stroke="#18181b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ak)"/><path d="M320.0,276.9 L210.0,315.3" fill="none" stroke="#18181b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ak)"/><path d="M630.0,187.2 L520.0,215.9" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="550.2" y="189.6" width="49.6" height="16" fill="#fff" opacity="0.92"/><text x="575.0" y="201.6" font-size="12" fill="#71717a" text-anchor="middle">PromQL</text><path d="M520.0,261.7 L630.0,283.4" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><text x="40" y="470" font-size="14" font-weight="700" fill="#71717a" text-anchor="start">Any-error alert: 50% precision, firing 35 s during 1% noise. Ratio alert: 100% precision.</text><text x="40" y="494" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">The ratio alert's 1 m window plus for: 30s left it firing for only 11 s of a 60 s incident.</text></svg>
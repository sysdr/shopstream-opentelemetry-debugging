<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 1 — A span's life</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><rect x="30" y="200" width="165" height="60" rx="30.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="112.5" y="235.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">started</text><rect x="215" y="200" width="165" height="60" rx="30.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="297.5" y="235.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">recording</text><rect x="400" y="200" width="165" height="60" rx="30.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="482.5" y="235.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">ended</text><rect x="585" y="200" width="165" height="60" rx="30.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="667.5" y="235.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">batched</text><rect x="770" y="200" width="165" height="60" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="852.5" y="235.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">exported</text><path d="M195.0,230.0 L215.0,230.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M380.0,230.0 L400.0,230.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M565.0,230.0 L585.0,230.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="553.5" y="200.0" width="43.0" height="16" fill="#fff" opacity="0.92"/><text x="575.0" y="212.0" font-size="12" fill="#71717a" text-anchor="middle">batch</text><path d="M750.0,230.0 L770.0,230.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="715.4" y="200.0" width="89.2" height="16" fill="#fff" opacity="0.92"/><text x="760.0" y="212.0" font-size="12" fill="#71717a" text-anchor="middle">every 500 ms</text><text x="30" y="330" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">Attributes (shop.sku, shop.amount) and events are added while recording;</text><text x="30" y="348" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">export is asynchronous, so tracing adds little to request latency.</text></svg>
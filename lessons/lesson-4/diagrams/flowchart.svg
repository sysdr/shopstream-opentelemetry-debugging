<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 4 — How a 5% connection leak becomes an outage</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><rect x="40" y="120" width="220" height="56" rx="28.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="150.0" y="144.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Request takes a</text><text x="150.0" y="162.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">connection</text><polygon points="150.0,220 260,255.0 150.0,290 40,255.0" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="150.0" y="251.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Error path</text><text x="150.0" y="269.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">returns it?</text><rect x="340" y="120" width="230" height="56" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="455.0" y="153.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Back in the pool</text><rect x="340" y="230" width="230" height="56" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="455.0" y="254.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Leaked forever</text><text x="455.0" y="272.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">pool 5 -&gt; 4 -&gt; ... -&gt; 0</text><rect x="650" y="230" width="260" height="56" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="780.0" y="254.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">New requests wait 1 s</text><text x="780.0" y="272.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">then 503 pool exhausted</text><rect x="650" y="340" width="260" height="56" rx="28.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="780.0" y="373.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Alert: pool &gt;= 80% for 10 s</text><path d="M150.0,176.0 L150.0,220.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M202.3,236.6 L375.2,176.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="254.1" y="194.3" width="69.4" height="16" fill="#fff" opacity="0.92"/><text x="288.8" y="206.3" font-size="12" fill="#71717a" text-anchor="middle">yes (95%)</text><path d="M256.7,256.0 L340.0,256.9" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="270.3" y="244.5" width="56.2" height="16" fill="#fff" opacity="0.92"/><text x="298.4" y="256.5" font-size="12" fill="#71717a" text-anchor="middle">no (5%)</text><path d="M570.0,258.0 L650.0,258.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M780.0,286.0 L780.0,340.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/></svg>
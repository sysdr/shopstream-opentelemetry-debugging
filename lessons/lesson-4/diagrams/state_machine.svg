t-anchor="middle">503s</text><path d="M240.0,230.0 L380.0,230.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="252.2" y="218.0" width="115.6" height="16" fill="#fff" opacity="0.92"/><text x="310.0" y="230.0" font-size="12" fill="#71717a" text-anchor="middle">leaks accumulate</text><path d="M560.0,230.0 L700.0,230.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="559.0" y="218.0" width="142.0" height="16" fill="#fff" opacity="0.92"/><text x="630.0" y="230.0" font-size="12" fill="#71717a" text-anchor="middle">last connection gone</text><path d="M790.0,260.0 L790.0,340.0 L150.0,340.0 L150.0,260.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="399.0" y="328.0" width="142.0" height="16" fill="#fff" opacity="0.92"/><text x="470.0" y="340.0" font-size="12" fill="#71717a" text-anchor="middle">restart / pool reset</text><text x="60" y="430" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">A restart hides the leak for a while; only fixing the release path ends it.</text></svg>
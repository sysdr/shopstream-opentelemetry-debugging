<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 5 — Containing a slow dependency</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><text x="32" y="82" font-size="14" fill="#71717a">Timeouts, jittered retries and a circuit breaker on checkout's call to payments</text><rect x="30" y="200" width="130" height="64" rx="32.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="95.0" y="228.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">24 clients</text><text x="95.0" y="246.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">browse + buy</text><rect x="210" y="170" width="230" height="124" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="325.0" y="210.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">checkout</text><text x="325.0" y="228.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">16 threads</text><text x="325.0" y="246.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">/catalog needs nothing</text><text x="325.0" y="264.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">/checkout needs payments</text><rect x="500" y="190" width="170" height="84" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="585.0" y="228.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">circuit</text><text x="585.0" y="246.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">breaker</text><path d="M730,190 v84 a95.0,10 0 0 0 190,0 v-84" fill="#fafafa" stroke="#18181b" stroke-width="1.5"/><ellipse cx="825.0" cy="190" rx="95.0" ry="10" fill="#fafafa" stroke="#18181b" stroke-width="1.5"/><text x="825.0" y="225.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">payments</text><text x="825.0" y="243.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">hangs 3 s</text><text x="825.0" y="261.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">per call</text><path d="M160.0,232.0 L210.0,232.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M440.0,232.0 L500.0,232.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="418.8" y="220.0" width="102.4" height="16" fill="#fff" opacity="0.92"/><text x="470.0" y="232.0" font-size="12" fill="#71717a" text-anchor="middle">300 ms timeout</text><rect x="412.2" y="236.0" width="115.6" height="16" fill="#fff" opacity="0.92"/><text x="470.0" y="248.0" font-size="12" fill="#71717a" text-anchor="middle">2 tries + jitter</text><path d="M670.0,232.0 L730.0,232.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><text x="40" y="470" font-size="14" font-weight="700" fill="#71717a" text-anchor="start">Payments hung 3 s: browse ok naive 76%, retry storm 41%, resilient 100% (p99 75 ms).</text><text x="40" y="494" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">Calls to payments per checkout: 1.00 naive, 4.00 retry storm, 0.01 with the breaker open.</text></svg>